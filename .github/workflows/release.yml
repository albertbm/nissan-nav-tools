name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go install fyne.io/tools/cmd/fyne@latest
      - name: Package
        working-directory: cmd/nissan-nav-tools
        run: fyne package -os darwin
      - name: Zip app
        working-directory: cmd/nissan-nav-tools
        run: ditto -c -k --keepParent "Nissan Nav Tools.app" "nissan-nav-tools-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: nissan-nav-tools-macos-${{ matrix.arch }}
          path: cmd/nissan-nav-tools/nissan-nav-tools-macos-${{ matrix.arch }}.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go install fyne.io/tools/cmd/fyne@latest
      - name: Package
        working-directory: cmd/nissan-nav-tools
        run: fyne package -os windows
      - name: Zip exe
        working-directory: cmd/nissan-nav-tools
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Filter *.exe | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath nissan-nav-tools-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nissan-nav-tools-windows-amd64
          path: cmd/nissan-nav-tools/nissan-nav-tools-windows-amd64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Fyne build deps
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: go build -o nissan-nav-tools ./cmd/nissan-nav-tools
      - name: Archive
        run: tar -czf nissan-nav-tools-linux-amd64.tar.gz nissan-nav-tools
      - uses: actions/upload-artifact@v4
        with:
          name: nissan-nav-tools-linux-amd64
          path: nissan-nav-tools-linux-amd64.tar.gz

  release:
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Mac app is unsigned: run `xattr -dr com.apple.quarantine "Nissan Nav Tools.app"`, or right-click it and choose Open.
            Windows SmartScreen will warn: click "More info", then "Run anyway".
            Beta: macOS only, so far.
